allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

subprojects { subproject ->
    if (subproject.name == 'app') return

    subproject.afterEvaluate {
        if (subproject.hasProperty('android')) {
            def androidExt = subproject.extensions.findByName('android')
            if (androidExt != null && androidExt.namespace == null) {
                def manifestFile = subproject.file('src/main/AndroidManifest.xml')
                if (manifestFile.exists()) {
                    def manifestXml = new XmlSlurper().parse(manifestFile)
                    def packageName = manifestXml.@package.text()
                    if (packageName) {
                        androidExt.namespace = packageName
                    }
                }
            }

            if (androidExt != null) {
                androidExt.compileSdkVersion 36
                androidExt.compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }

        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}